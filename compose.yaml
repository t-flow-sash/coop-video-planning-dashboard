services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coop}
      POSTGRES_USER: ${POSTGRES_USER:-coop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coop-local-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - coop-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  coop-postgres:
