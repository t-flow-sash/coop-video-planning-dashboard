apiVersion: v1
kind: ConfigMap
metadata:
  name: gmail-egress-proxy-config
data:
  envoy.yaml: |
    static_resources:
      listeners:
        - name: gmail_connect_proxy
          address:
            socket_address:
              address: 0.0.0.0
              port_value: 10000
          filter_chains:
            - filters:
                - name: envoy.filters.network.http_connection_manager
                  typed_config:
                    "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                    stat_prefix: gmail_connect_proxy
                    codec_type: AUTO
                    route_config:
                      name: connect_routes
                      virtual_hosts:
                        - name: google_apis
                          domains: ["*"]
                          routes:
                            - match:
                                connect_matcher: {}
                              route:
                                cluster: google_dynamic_forward_proxy
                                timeout: 30s
                                upgrade_configs:
                                  - upgrade_type: CONNECT
                                    connect_config: {}
                    http_filters:
                      - name: envoy.filters.http.rbac
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.rbac.v3.RBAC
                          rules:
                            action: ALLOW
                            policies:
                              google-api-connect:
                                permissions:
                                  - header:
                                      name: ":authority"
                                      string_match:
                                        exact: oauth2.googleapis.com:443
                                  - header:
                                      name: ":authority"
                                      string_match:
                                        exact: gmail.googleapis.com:443
                                principals:
                                  - any: true
                      - name: envoy.filters.http.dynamic_forward_proxy
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                          dns_cache_config:
                            name: google_dns_cache
                            dns_lookup_family: V4_ONLY
                      - name: envoy.filters.http.router
                        typed_config:
                          "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
        - name: google_dynamic_forward_proxy
          connect_timeout: 10s
          lb_policy: CLUSTER_PROVIDED
          cluster_type:
            name: envoy.clusters.dynamic_forward_proxy
            typed_config:
              "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
              dns_cache_config:
                name: google_dns_cache
                dns_lookup_family: V4_ONLY
    overload_manager:
      refresh_interval: 0.25s
      resource_monitors:
        - name: envoy.resource_monitors.global_downstream_max_connections
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.resource_monitors.downstream_connections.v3.DownstreamConnectionsConfig
            max_active_downstream_connections: 128
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gmail-egress-proxy
  labels: &labels
    app.kubernetes.io/name: gmail-egress-proxy
    app.kubernetes.io/part-of: coop-video-planning
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gmail-egress-proxy
  template:
    metadata:
      labels: *labels
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: envoy
          # Upstream multi-arch digest, verified from envoyproxy/envoy distroless-v1.35.3.
          image: docker.io/envoyproxy/envoy:distroless-v1.35.3@sha256:f9080877fdbaecc788e79e200d912382e57f780b63752160e27dfe34f5d0aa36
          imagePullPolicy: IfNotPresent
          args: ["-c", "/etc/envoy/envoy.yaml", "--log-level", "critical"]
          ports:
            - {name: proxy, containerPort: 10000, protocol: TCP}
          readinessProbe:
            tcpSocket: {port: proxy}
            periodSeconds: 10
            timeoutSeconds: 2
          livenessProbe:
            tcpSocket: {port: proxy}
            periodSeconds: 20
            timeoutSeconds: 2
          resources:
            requests: {cpu: 25m, memory: 48Mi}
            limits: {cpu: 250m, memory: 128Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: config, mountPath: /etc/envoy, readOnly: true}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap:
            name: gmail-egress-proxy-config
        - name: tmp
          emptyDir: {sizeLimit: 16Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: gmail-egress-proxy
  labels:
    app.kubernetes.io/name: gmail-egress-proxy
    app.kubernetes.io/part-of: coop-video-planning
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: gmail-egress-proxy
  ports:
    - {name: proxy, port: 10000, targetPort: proxy, protocol: TCP}
