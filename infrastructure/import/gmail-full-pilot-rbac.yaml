apiVersion: v1
kind: ServiceAccount
metadata:
  name: gmail-full-pilot-operator
  namespace: coop-prod
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gmail-full-pilot-runtime
  namespace: coop-prod
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gmail-full-pilot-operator
  namespace: coop-prod
rules:
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    resourceNames: ["gmail-import-full"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "update", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["gmail-egress-proxy"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["services", "endpoints"]
    resourceNames: ["gmail-egress-proxy"]
    verbs: ["get"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames:
      - gmail-egress-proxy-config
      - gmail-import-full-pilot-consumed
      - gmail-full-pilot-admission-params
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames:
      - gmail-oauth
      - gmail-collector-db
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gmail-full-pilot-operator
  namespace: coop-prod
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gmail-full-pilot-operator
subjects:
  - kind: ServiceAccount
    name: gmail-full-pilot-operator
    namespace: coop-prod
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: gmail-full-pilot-flux-reader
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    resourceNames: ["coop-root", "coop-database", "coop-migration", "coop-import"]
    verbs: ["get"]
  - apiGroups: ["source.toolkit.fluxcd.io"]
    resources: ["gitrepositories"]
    resourceNames: ["coop-video-planning"]
    verbs: ["get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicies"]
    resourceNames: ["gmail-full-pilot-operator", "gmail-full-pilot-slot"]
    verbs: ["get"]
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingadmissionpolicybindings"]
    resourceNames: ["gmail-full-pilot-operator", "gmail-full-pilot-slot"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gmail-full-pilot-flux-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: gmail-full-pilot-flux-reader
subjects:
  - kind: ServiceAccount
    name: gmail-full-pilot-operator
    namespace: coop-prod
