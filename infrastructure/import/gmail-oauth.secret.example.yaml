# Value-free template only. Copy to gmail-oauth.secret.sops.yaml, populate from the
# root-only operator store, encrypt with SOPS, then explicitly add that encrypted file
# to kustomization.yaml. Request only the Gmail gmail.readonly OAuth scope.
apiVersion: v1
kind: Secret
metadata:
  name: gmail-oauth
  namespace: coop-prod
type: Opaque
data: {}
# Required keys: GMAIL_CLIENT_ID, GMAIL_CLIENT_SECRET, GMAIL_REFRESH_TOKEN,
# GMAIL_ACCOUNT.
