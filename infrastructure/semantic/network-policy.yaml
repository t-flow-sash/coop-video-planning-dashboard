apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gmail-semantic-worker-egress
spec:
  podSelector:
    matchLabels:
      coop.example.com/semantic-worker: "true"
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: kube-system}
          podSelector:
            matchLabels: {k8s-app: kube-dns}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: postgres}
      ports:
        - {protocol: TCP, port: 5432}
    - to:
        - podSelector:
            matchLabels: {app.kubernetes.io/name: gmail-egress-proxy}
      ports:
        - {protocol: TCP, port: 10000}
