# Template only. Add real htpasswd output to key `users`, encrypt with SOPS,
# save as coop-basic-auth.secret.sops.yaml and add it to this directory's kustomization.
apiVersion: v1
kind: Secret
metadata:
  name: coop-basic-auth
  namespace: coop-prod
type: Opaque
data: {}
# Required key: users
---
# TLS may be supplied by cert-manager or copied from a trusted source. Never commit plaintext keys.
apiVersion: v1
kind: Secret
metadata:
  name: coop-tls
  namespace: coop-prod
type: kubernetes.io/tls
data: {}
# Required keys: tls.crt, tls.key
