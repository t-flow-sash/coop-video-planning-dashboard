apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: coop-https
spec:
  entryPoints: [websecure]
  routes:
    - match: Host(`coop.example.invalid`) && Path(`/api/v1/health/live`)
      kind: Rule
      priority: 200
      services:
        - {name: coop-api, port: 8000}
    - match: Host(`coop.example.invalid`) && Path(`/api/v1/health/ready`)
      kind: Rule
      priority: 200
      services:
        - {name: coop-api, port: 8000}
    - match: Host(`coop.example.invalid`) && PathPrefix(`/api/v1`)
      kind: Rule
      priority: 100
      middlewares:
        - name: coop-basic-auth
      services:
        - {name: coop-api, port: 8000}
    - match: Host(`coop.example.invalid`) && PathPrefix(`/`)
      kind: Rule
      priority: 10
      middlewares:
        - name: coop-basic-auth
      services:
        - {name: coop-web, port: 3000}
  tls:
    secretName: coop-tls
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: coop-http-redirect
spec:
  entryPoints: [web]
  routes:
    - match: Host(`coop.example.invalid`) && PathPrefix(`/`)
      kind: Rule
      middlewares:
        - name: redirect-https
      services:
        - {name: noop@internal, kind: TraefikService}
