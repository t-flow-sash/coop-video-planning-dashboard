apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: coop-basic-auth
spec:
  basicAuth:
    secret: coop-basic-auth
    # Keep Authorization for the upstream API; Traefik's BasicAuth still validates it.
    removeHeader: false
---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-https
spec:
  redirectScheme:
    scheme: https
    permanent: true
