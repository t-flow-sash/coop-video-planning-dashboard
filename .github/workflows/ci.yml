name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  quality:
    if: >-
      github.event_name != 'pull_request' ||
      (github.actor == github.repository_owner &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, repo-coop-video-planning-dashboard]
    # A stalled step must fail loudly instead of holding a runner indefinitely.
    timeout-minutes: 45
    services:
      postgres:
        image: docker.io/library/postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
        env:
          POSTGRES_DB: coop_test
          POSTGRES_USER: coop
          POSTGRES_PASSWORD: coop
          PGPORT: "55435"
        ports: ["55435:55435"]
        options: >-
          --health-cmd "pg_isready -U coop -d coop_test -p 55435"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://coop:coop@127.0.0.1:55435/coop_test
      COLLECTOR_DATABASE_URL: postgresql+psycopg://coop_evidence_collector:collector-ci-only@127.0.0.1:55435/coop_test
      SEMANTIC_DATABASE_URL: postgresql+psycopg://coop_semantic_writer:semantic-ci-only@127.0.0.1:55435/coop_test
      NEXT_PUBLIC_API_URL: /api/v1
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: { fetch-depth: 0 }
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with: { enable-cache: true }
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 12.11.2 }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4
        with: { version: v1.31.4 }
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --all-groups --frozen
      - run: uv run --project apps/api python -m app.database_access provision
      - run: uv run --project apps/api alembic upgrade head
      - run: uv run --project apps/api python -m app.database_access reconcile
      # The semantic writer's attestation requires the database-wide routine and
      # schema invariants that the collector reconcile establishes first.
      - run: uv run --project apps/api python -m app.semantic_database_access provision
      - run: uv run --project apps/api python -m app.semantic_database_access reconcile
      - run: uv run --project apps/api python -m app.seed
      - run: cd apps/api && uv run ruff format --check app tests alembic
      - run: cd apps/api && uv run ruff check app tests alembic
      - run: cd apps/api && uv run mypy app
      - name: Attest PostgreSQL service address
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -Eeuo pipefail
          test -n "$POSTGRES_SERVICE_ID"
          service_ip="$(docker inspect --format '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$POSTGRES_SERVICE_ID")"
          python3 - "$service_ip" <<'PY'
          import ipaddress
          import sys

          address = ipaddress.ip_address(sys.argv[1])
          if not address.is_private or address.is_loopback:
              raise SystemExit("PostgreSQL service address must be private and non-loopback")
          PY
          printf 'TEST_DATABASE_EXPECTED_SERVER_ADDRESS=%s\n' "$service_ip" >> "$GITHUB_ENV"
      - run: cd apps/api && uv run pytest
      - run: uv run --project apps/api alembic check
      - run: pnpm format:check
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: node --test scripts/tests/*.test.mjs
      - run: uv run --with pyyaml==6.0.3 -- python3 -m unittest scripts.tests.test_gitops_static scripts.tests.test_operational_scripts scripts.tests.test_collector_isolation_static scripts.tests.test_gmail_egress_proxy scripts.tests.test_gmail_full_pilot scripts.tests.test_semantic_release
      - run: node --check scripts/e2e-gateway.mjs
      - run: pnpm --filter web build
      - name: Build and smoke-test production images
        run: |
          set -Eeuo pipefail
          docker build --tag coop-api:ci --file apps/api/Dockerfile apps/api
          docker build --tag coop-web:ci --file apps/web/Dockerfile .

          for image in coop-api:ci coop-web:ci; do
            configured_user="$(docker image inspect --format '{{.Config.User}}' "$image")"
            [[ -n "$configured_user" && "$configured_user" != 0 && "$configured_user" != root ]]
            docker run --rm --read-only --entrypoint /bin/sh "$image" \
              -c 'test "$(id -u)" -ne 0 && ! touch /read-only-rootfs-probe'
          done

          cleanup_images() {
            docker rm -f coop-api-smoke coop-web-smoke >/dev/null 2>&1 || true
          }
          trap cleanup_images EXIT INT TERM
          docker run -d --name coop-api-smoke --network host --read-only --tmpfs /tmp \
            -e DATABASE_URL="$DATABASE_URL" coop-api:ci >/dev/null
          docker run -d --name coop-web-smoke -p 3000:3000 --read-only \
            --tmpfs /tmp --tmpfs /app/apps/web/.next/cache coop-web:ci >/dev/null
          for container in coop-api-smoke coop-web-smoke; do
            [[ "$(docker exec "$container" id -u)" -ne 0 ]]
          done
          ready=false
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/live >/dev/null \
              && curl -fsS http://127.0.0.1:3000/ >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          [[ "$ready" == true ]] || {
            docker logs coop-api-smoke
            docker logs coop-web-smoke
            exit 1
          }
      - name: Prove migrations from production API image
        env:
          POSTGRES_SERVICE_ID: ${{ job.services.postgres.id }}
        run: |
          set -Eeuo pipefail
          image_database='coop_image_migration_test'
          image_database_url="postgresql+psycopg://coop:coop@127.0.0.1:55435/$image_database"
          image_collector_url="postgresql+psycopg://coop_evidence_collector:collector-ci-only@127.0.0.1:55435/$image_database"
          image_semantic_url="postgresql+psycopg://coop_semantic_writer:semantic-ci-only@127.0.0.1:55435/$image_database"
          test -n "$POSTGRES_SERVICE_ID"
          docker exec "$POSTGRES_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U coop -d postgres \
            -c "DROP DATABASE IF EXISTS $image_database"
          docker exec "$POSTGRES_SERVICE_ID" psql -v ON_ERROR_STOP=1 -U coop -d postgres \
            -c "CREATE DATABASE $image_database"
          image_run=(docker run --rm --network host --read-only --tmpfs /tmp \
            -e DATABASE_URL="$image_database_url" \
            -e COLLECTOR_DATABASE_URL="$image_collector_url" \
            -e SEMANTIC_DATABASE_URL="$image_semantic_url" coop-api:ci)
          "${image_run[@]}" python -m app.database_access provision
          "${image_run[@]}" alembic upgrade head
          "${image_run[@]}" python -m app.database_access reconcile
          "${image_run[@]}" python -m app.semantic_database_access provision
          "${image_run[@]}" python -m app.semantic_database_access reconcile
          # The promoted image must ship the semantic runner, writer ACL and CLI.
          "${image_run[@]}" python -c 'import app.ingestion.gmail_semantic_queue; import app.ingestion.gmail_semantic_delta; import app.semantic_database_access'
          "${image_run[@]}" python -c \
            'import app.database_access; import os; import psycopg; from sqlalchemy.engine import make_url; url=make_url(os.environ["DATABASE_URL"]).set(drivername="postgresql").render_as_string(hide_password=False); connection=psycopg.connect(url); version=connection.execute("SELECT version_num FROM alembic_version").fetchone(); source=connection.execute("SELECT source_key, kind, enabled FROM ingestion_source WHERE source_key = %s", ("gmail-open-coops-v1",)).fetchone(); connection.close(); assert version == ("6a8d1e42c907",), version; assert source == ("gmail-open-coops-v1", "GMAIL", True), source'
      - name: Validate API Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with: { dockerfile: apps/api/Dockerfile }
      - name: Validate Web Dockerfile
        uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with: { dockerfile: apps/web/Dockerfile }
      - name: Render and schema-check GitOps manifests
        run: |
          set -Eeuo pipefail
          curl -fsSL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz \
            -o /tmp/kubeconform.tar.gz
          echo 'c31518ddd122663b3f3aa874cfe8178cb0988de944f29c74a0b9260920d115d3  /tmp/kubeconform.tar.gz' \
            | sha256sum --check --strict
          tar -xzf /tmp/kubeconform.tar.gz kubeconform
          schema_catalog='https://raw.githubusercontent.com/datreeio/CRDs-catalog/63669a570e231d4f1f8396d229a1de512bcf0a34/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          for dir in infrastructure/storage infrastructure/database infrastructure/migration infrastructure/import infrastructure/semantic infrastructure/apps infrastructure/ingress infrastructure/backup clusters/production; do
            output="/tmp/$(echo "$dir" | tr / -).yaml"
            # Flux removes top-level SOPS metadata before apply. Strip only that
            # metadata block here; encrypted Secret values remain schema-checked.
            kubectl kustomize "$dir" | awk '
              /^sops:$/ { skip=1; next }
              skip && /^---$/ { skip=0 }
              !skip { print }
            ' > "$output"
            uv run --with pyyaml==6.0.3 -- python3 scripts/validate-rendered-images.py < "$output"
            if [[ "$dir" != infrastructure/import && "$dir" != infrastructure/semantic ]] && grep -Eq 'git-0{12}|sha256:0{64}' "$output"; then
              echo "Unpromoted image sentinel remains in deployable render: $dir" >&2
              exit 1
            fi
            if [[ "$dir" == infrastructure/import ]] && grep -Eq 'git-0{12}|sha256:0{64}' "$output"; then
              # The import slice may retain its fail-closed sentinel only while
              # every scheduler is declaratively suspended.
              uv run --with pyyaml==6.0.3 -- python3 -c '
          import sys, yaml
          docs = [doc for doc in yaml.safe_load_all(open(sys.argv[1])) if doc]
          jobs = [doc for doc in docs if doc.get("kind") == "CronJob"]
          assert len(jobs) == 3 and all(job["spec"].get("suspend") is True for job in jobs)
          ' "$output"
            fi
            if [[ "$dir" == infrastructure/semantic ]]; then
              # Activated writer slice: exact resource inventory, promoted digest,
              # unsuspended owner and CronJob, explicit arm flag and dedicated
              # secretRefs. Keep the check unconditional so neither a reverted
              # promotion nor a silently re-dormanted scheduler escapes review.
              uv run --with pyyaml==6.0.3 -- python3 scripts/validate_semantic_activation.py \
                "$output" clusters/production/flux-kustomizations.yaml \
                infrastructure/semantic/kustomization.yaml
            fi
            ./kubeconform -strict -summary -skip CustomResourceDefinition \
              -schema-location default -schema-location "$schema_catalog" "$output"
          done
      - name: Validate shell syntax
        run: bash -n scripts/*.sh
      - run: pnpm exec playwright install --with-deps chrome
      - run: |
          set -Eeuo pipefail

          api_pid=""
          web_pid=""
          gateway_pid=""
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            for pid in "$gateway_pid" "$web_pid" "$api_pid"; do
              if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
                kill -TERM "$pid" 2>/dev/null || true
              fi
            done
            for _ in {1..25}; do
              running=false
              for pid in "$gateway_pid" "$web_pid" "$api_pid"; do
                if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
                  running=true
                fi
              done
              [[ "$running" == true ]] || break
              sleep 0.2
            done
            for pid in "$gateway_pid" "$web_pid" "$api_pid"; do
              if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
                kill -KILL "$pid" 2>/dev/null || true
              fi
              if [[ -n "$pid" ]]; then
                wait "$pid" 2>/dev/null || true
              fi
            done
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          mkdir -p apps/web/.next/standalone/apps/web/.next
          cp -R apps/web/.next/static apps/web/.next/standalone/apps/web/.next/static
          if [[ -d apps/web/public ]]; then
            cp -R apps/web/public apps/web/.next/standalone/apps/web/public
          fi

          # The backend test fixtures truncate the shared CI database after each test.
          uv run --project apps/api python -m app.seed

          (cd apps/api && exec .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000) &
          api_pid=$!
          (cd apps/web/.next/standalone && HOSTNAME=127.0.0.1 PORT=3000 exec node apps/web/server.js) &
          web_pid=$!
          GATEWAY_PORT=3001 API_ORIGIN=http://127.0.0.1:8000 \
            WEB_ORIGIN=http://127.0.0.1:3000 node scripts/e2e-gateway.mjs &
          gateway_pid=$!

          ready=false
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:3001/_gateway/health \
              && curl -fsS http://127.0.0.1:3001/api/v1/health/ready \
              && curl -fsS http://127.0.0.1:3001/coops; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "E2E gateway and upstreams did not become ready after 30 attempts" >&2
            exit 1
          fi

          E2E_BASE_URL=http://127.0.0.1:3001 pnpm exec playwright test
