name: CI
on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: coop_test
          POSTGRES_USER: coop
          POSTGRES_PASSWORD: coop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coop -d coop_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://coop:coop@127.0.0.1:5432/coop_test
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000/api/v1
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: { enable-cache: true }
      - uses: pnpm/action-setup@v4
        with: { version: 12.11.2 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: uv sync --project apps/api --all-groups --frozen
      - run: uv run --project apps/api alembic upgrade head
      - run: uv run --project apps/api python -m app.seed
      - run: cd apps/api && uv run ruff format --check app tests alembic
      - run: cd apps/api && uv run ruff check app tests alembic
      - run: cd apps/api && uv run mypy app
      - run: uv run --project apps/api pytest
      - run: uv run --project apps/api alembic check
      - run: pnpm format:check
      - run: pnpm --filter web lint
      - run: pnpm --filter web typecheck
      - run: pnpm --filter web test
      - run: pnpm --filter web build
      - run: pnpm exec playwright install --with-deps chrome
      - run: |
          set -Eeuo pipefail

          api_pid=""
          web_pid=""
          cleanup() {
            status=$?
            trap - EXIT INT TERM
            for pid in "$web_pid" "$api_pid"; do
              if [[ -n "$pid" ]] && kill -0 "$pid" 2>/dev/null; then
                kill "$pid" 2>/dev/null || true
              fi
            done
            for pid in "$web_pid" "$api_pid"; do
              if [[ -n "$pid" ]]; then
                wait "$pid" 2>/dev/null || true
              fi
            done
            exit "$status"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM

          (cd apps/api && exec .venv/bin/uvicorn app.main:app --host 127.0.0.1 --port 8000) &
          api_pid=$!
          (cd apps/web && exec ./node_modules/.bin/next start --hostname 127.0.0.1 --port 3000) &
          web_pid=$!

          ready=false
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8000/api/v1/health/ready \
              && curl -fsS http://127.0.0.1:3000/coops; then
              ready=true
              break
            fi
            sleep 2
          done
          if [[ "$ready" != true ]]; then
            echo "E2E servers did not become ready after 30 attempts" >&2
            exit 1
          fi

          pnpm exec playwright test
