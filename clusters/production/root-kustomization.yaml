apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: coop-root
  namespace: flux-system
spec:
  interval: 10m
  retryInterval: 1m
  timeout: 20m
  path: ./clusters/production
  prune: true
  # Child Kustomizations perform their own waits. Waiting here would make the
  # self-managed coop-root health-check its own in-progress reconciliation.
  wait: false
  sourceRef:
    kind: GitRepository
    name: coop-video-planning
  decryption:
    provider: sops
    secretRef:
      name: sops-age
